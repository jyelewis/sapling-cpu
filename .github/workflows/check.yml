name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install oss-cad-suite
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install verible
        run: |
          VERIBLE_VERSION="v0.0-4053-g89d4d98a"
          wget -q "https://github.com/chipsalliance/verible/releases/download/${VERIBLE_VERSION}/verible-${VERIBLE_VERSION}-linux-static-x86_64.tar.gz" -O verible.tar.gz
          tar xzf verible.tar.gz
          echo "$PWD/verible-${VERIBLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync python dependencies
        run: uv sync

      - name: Python lint (ruff)
        run: uv run ruff check

      - name: Python format check (ruff)
        run: uv run ruff format --check

      - name: HDL format check
        run: |
          make hdl-fmt
          git diff --exit-code -- . || (echo "HDL files not formatted. Run 'make hdl-fmt' and commit." && exit 1)

      - name: HDL lint
        run: make hdl-lint

      - name: HDL build
        run: make hdl-build

      - name: Tests
        run: |
          export PATH="/usr/bin:/usr/local/bin:$PATH"
          make test
        env:
          LD_LIBRARY_PATH: ""
